server {
    listen 80;
    server_name finacademy.kz www.finacademy.kz;
    return 308 https://finacademy.kz$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name www.finacademy.kz;
    ssl_certificate /etc/letsencrypt/live/finacademy.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finacademy.kz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 308 https://finacademy.kz$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name finacademy.kz;
    ssl_certificate /etc/letsencrypt/live/finacademy.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finacademy.kz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /var/www/finance-academy;
    index index.html;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=86400" always;
    gzip on;
    gzip_types application/javascript application/json text/css;
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_hide_header X-Worker-Colo;
    }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; }
    location ~ /\. { deny all; }
}
