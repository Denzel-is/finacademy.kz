# Apply only after a new pinned-host SSH connection has authenticated with the
# owner's private key. Console/root password recovery remains in Hoster.kz.
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
MaxAuthTries 3
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
