# Loaded in nginx's http context by sites-enabled; no traffic is rate limited
# except login. A 60-request burst permits a 50-person classroom behind one IP.
limit_req_zone $binary_remote_addr zone=finance_login:10m rate=2r/s;
server {
    listen 80;
    server_name finacademy.kz www.finacademy.kz;
    server_tokens off;
    return 308 https://finacademy.kz$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name www.finacademy.kz;
    ssl_certificate /etc/letsencrypt/live/finacademy.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finacademy.kz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/finance-academy-security.conf;
    server_tokens off;
    return 308 https://finacademy.kz$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name finacademy.kz;
    ssl_certificate /etc/letsencrypt/live/finacademy.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finacademy.kz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/finance-academy-security.conf;
    server_tokens off;
    root /var/www/finance-academy;
    index index.html;
    # Application accepts up to 8 MiB; allow JSON overhead at the reverse proxy.
    client_max_body_size 12m;
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 20s;
    gzip on;
    gzip_types application/javascript application/json text/css;
    location = /api/auth/login {
        limit_req zone=finance_login burst=60 nodelay;
        limit_req_status 429;
        error_page 429 = @login_limited;
        include /etc/nginx/snippets/finance-academy-proxy.conf;
        include /etc/nginx/snippets/finance-academy-security.conf;
        add_header Cache-Control "no-store" always;
    }
    location @login_limited {
        include /etc/nginx/snippets/finance-academy-security.conf;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "30" always;
        default_type application/json;
        return 429 '{"error":"Слишком много попыток входа. Повторите через 30 секунд."}';
    }
    location /api/ {
        include /etc/nginx/snippets/finance-academy-proxy.conf;
        include /etc/nginx/snippets/finance-academy-security.conf;
        add_header Cache-Control "no-store" always;
    }
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/finance-academy-security.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/finance-academy-security.conf;
        add_header Cache-Control "no-cache" always;
    }
    location ~ /\. { deny all; }
}
